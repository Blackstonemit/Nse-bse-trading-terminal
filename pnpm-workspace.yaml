# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
minimumReleaseAge: 1440

packages:
  - artifacts/*
  - lib/*
  - scripts

catalog:
  '@tailwindcss/vite': ^4.1.16
  '@tanstack/react-query': ^5.101.2
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  esbuild: ^0.27.3
  framer-motion: ^12.42.2
  lucide-react: ^1.24.0
  react: 19.2.7
  react-dom: 19.2.7
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.16
  tsx: ^4.21.0
  vite: ^7.3.5
  wouter: ^3.3.5
  yahoo-finance2: ^4.0.0
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - lightningcss
  - msw
  - unrs-resolver
  - rollup
  - better-sqlite3
  - electron

overrides:
  esbuild: "0.27.3"
  lightningcss: "1.31.1"
  rollup: "4.59.0"
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"

allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  lightningcss: true
  rollup: true
